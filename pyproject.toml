[project]
name = "convexa"
version = "3.0.0"
description = "Personal knowledge workspace with optional AI and persistent hosted storage"
requires-python = ">=3.10,<3.15"
dependencies = [
    "pypdf==6.21.4",
    "youtube-transcript-api==1.2.5",
    "cryptography==46.0.7",
    "libsql==0.1.11; sys_platform == 'linux'",
]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '/(data|\.venv|node_modules)/'
